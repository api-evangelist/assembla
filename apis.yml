aid: assembla

name: Assembla

description: Assembla provides managed cloud hosting for Perforce, Subversion (SVN) and Git repositories, along with integrated project management
  tools. Their platform offers enterprise‑grade security, SOC 2 Type II compliance, GDPR adherence, and AI‑powered DevOps assistance. Serving
  over 1.5 million users for more than two decades, Assembla delivers scalable, secure version‑control hosting, code review, ticketing, sprint
  planning, and extensive integrations with tools like Slack, Jira, and CI/CD pipelines.

